<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" id="cursor-nesw" height="23" width="23">
  <desc>
    Pixel-Cursor "nesw" (diagonaler Doppelpfeil, oben-rechts nach unten-links), 21x21-Raster wie cursor-pan.svg.
    Schwarze Fuellung mit heller Kontur, damit er auf hellem UND dunklem
    Untergrund sichtbar bleibt - reines Schwarz hat auf dem Dunkelmodus-Viewer
    (#0d1117) nur 1,1:1 Kontrast.
    Hotspot: Zelle 10,10 = 11 11 in CSS.
  </desc>
